<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piper ML and AI Film</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
/* Film segment: how Piper uses data, from start to finish, in five steps:
   Data → Evidence in the city → Severity → Action → Prevention. One short headline per scene.
   1920×1080 stage; every frame is render(t) (?t=12.3 to scrub). Red = what happened, blue = model, violet = severity. */
:root {
  --bg: #111315; --panel: #181B1E; --card: #1F2327; --line: #2F353B;
  --fg: #F2F3F1; --fg2: #AEB5BC; --fg3: #8A929A;
  --model: #6FA0FF; --actual: #FF5A4E; --held: #3DBE7A; --warn: #FFA23A; --sev: #B794F6;
  --display: "Bodoni Moda", "Bodoni 72", Didot, serif;
  --sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
}
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bg); color: var(--fg); font-family: var(--sans); transform-origin: 0 0; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; }
.h { position: absolute; left: 120px; top: 96px; font: 700 64px/1.1 var(--sans); letter-spacing: -0.01em; margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.blue { color: var(--model); } .red { color: var(--actual); } .green { color: var(--held); } .violet { color: var(--sev); }
canvas { position: absolute; }
.chip { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font: 500 28px var(--sans); white-space: nowrap; }
.chip .ic { display: flex; color: var(--fg2); } .chip .ck { color: var(--model); font-weight: 700; }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.lbl { font: 600 22px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); }
.check { color: var(--held); font-weight: 700; margin-right: 12px; }
.note { font: 500 18px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
.ev { position: absolute; left: 120px; width: 600px; padding: 20px 24px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font: 500 28px/1.3 var(--sans); }
.ev b { font-family: var(--mono); font-weight: 500; }
.ev small { display: block; font-size: 20px; color: var(--fg3); margin-top: 4px; font-weight: 400; }
#journey { position: absolute; right: 100px; top: 60px; display: flex; gap: 8px; align-items: center; font: 600 21px var(--sans); opacity: 0; z-index: 5; }
#journey span.s { padding: 6px 13px; border-radius: 999px; color: var(--fg3); border: 1px solid transparent; white-space: nowrap; }
#journey span.on { color: var(--bg); background: var(--fg); }
#journey span.done { color: var(--fg2); border-color: var(--line); }
#journey i { width: 16px; height: 2px; background: var(--line); display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="journey"></div>

  <!-- Intro: the five steps -->
  <section class="scene" id="s0">
    <div id="s0t" style="position:absolute;left:0;right:0;top:300px;text-align:center;font:italic 500 120px var(--display)">Data, from start to finish</div>
    <svg id="s0p" width="1600" height="180" viewBox="0 0 1600 180" style="position:absolute;left:160px;top:540px;overflow:visible"></svg>
  </section>

  <!-- 1 Data -->
  <section class="scene" id="s1">
    <h1 class="h">43 datasets tested</h1>
    <div id="s1chips"></div>
  </section>

  <!-- 2 Evidence in the city (3D map) -->
  <section class="scene" id="s2">
    <div id="s2map" style="position:absolute;inset:0"></div>
    <div style="position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(#111315 30%,rgba(17,19,21,0))"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:180px;background:linear-gradient(rgba(17,19,21,0),#111315 80%)"></div>
    <h1 class="h">Problems and evidence across Boston</h1>
    <div id="s2leg" style="position:absolute;left:120px;bottom:90px;font-size:26px;color:var(--fg2)"><i style="display:inline-block;width:18px;height:18px;background:#FF5A4E;border-radius:3px;margin-right:12px;vertical-align:-2px"></i>Rodent reports · last 12 weeks</div>
  </section>

  <!-- 3 Severity -->
  <section class="scene" id="s3">
    <h1 class="h">How severe is each block?</h1>
    <div id="s3row" style="position:absolute;left:120px;top:230px;width:1680px;height:330px"></div>
    <canvas id="s3a" width="480" height="270" style="left:120px;top:280px"></canvas>
    <canvas id="s3b" width="480" height="270" style="left:720px;top:280px"></canvas>
    <canvas id="s3c" width="480" height="270" style="left:1320px;top:280px"></canvas>
    <div id="s3eq" style="position:absolute;left:120px;top:600px;font-size:28px;color:var(--fg2)"><span style="font:500 52px var(--mono);color:var(--fg3);margin-right:16px;vertical-align:-6px">=</span><i style="display:inline-block;width:16px;height:16px;border-radius:3px;background:#B794F6;margin-right:10px;vertical-align:-1px"></i>Severity</div>
    <canvas id="s3big" width="900" height="400" style="left:120px;top:660px"></canvas>
    <div id="s3list" style="position:absolute;left:1120px;top:640px;width:680px"></div>
  </section>

  <!-- 4 Action -->
  <section class="scene" id="s4">
    <h1 class="h" id="s4h"></h1>
    <div id="s4ev"></div>
    <svg id="s4arrows" width="1920" height="1080" style="position:absolute;left:0;top:0;overflow:visible"></svg>
    <div class="panel" id="s4sol" style="left:1080px;top:330px;width:720px;padding:34px 38px;background:#1F2327"></div>
  </section>

  <!-- 5 Prevention: forecast + early warning -->
  <section class="scene" id="s5">
    <h1 class="h">Prevent what's coming</h1>
    <canvas id="s5c" width="1000" height="880" style="left:880px;top:170px"></canvas>
    <div id="s5call" style="position:absolute;left:120px;top:330px;width:680px"></div>
  </section>

  <!-- 5 Prevention: proof -->
  <section class="scene" id="s6">
    <h1 class="h">Where the model looked</h1>
    <svg id="s6tl" width="1680" height="100" viewBox="0 0 1680 100" style="position:absolute;left:120px;top:214px;overflow:visible"></svg>
    <div class="lbl" style="position:absolute;left:120px;top:350px">Actual</div>
    <div class="lbl" style="position:absolute;left:688px;top:350px">Model</div>
    <div class="lbl" style="position:absolute;left:1256px;top:350px">Both</div>
    <canvas id="s6a" width="544" height="540" style="left:120px;top:390px"></canvas>
    <canvas id="s6b" width="544" height="540" style="left:688px;top:390px"></canvas>
    <canvas id="s6c" width="544" height="540" style="left:1256px;top:390px"></canvas>
    <div id="s6call" style="position:absolute;left:120px;right:120px;top:960px;display:flex;gap:44px;align-items:baseline;font-size:28px;color:var(--fg2)"></div>
  </section>

  <!-- In the platform (simulation) -->
  <section class="scene" id="s7">
    <div id="app" style="position:absolute;left:60px;top:60px;width:1800px;height:960px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0D1A26">
      <canvas id="s7map" width="1800" height="960" style="left:0;top:0"></canvas>
      <div style="position:absolute;left:0;right:0;top:0;height:64px;background:rgba(17,19,21,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:26px;padding:0 26px">
        <span style="font:italic 500 34px var(--display);color:var(--fg)">Piper</span>
        <span style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:20px">
          <span style="padding:7px 16px;background:var(--fg);color:var(--bg);font-weight:600">Assess</span><span style="padding:7px 16px;color:var(--fg2)">Act</span></span>
        <span style="margin-left:auto;font-size:20px;color:var(--fg2)"><span style="display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--held);margin-right:8px"></span>Live</span>
      </div>
      <div id="fcCtl" class="panel" style="left:24px;top:88px;width:360px;padding:18px 20px;font-size:20px"></div>
      <div id="rp" class="panel" style="right:0;top:64px;bottom:0;width:560px;border-radius:0;border-width:0 0 0 1px;background:rgba(24,27,30,.96)"></div>
      <svg id="cursor" width="34" height="40" viewBox="0 0 34 40" style="position:absolute;left:0;top:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))"><path d="M3 2 L3 33 L11 25 L17 38 L23 35 L17 23 L29 23 Z" fill="#F2F3F1" stroke="#111315" stroke-width="2"/></svg>
      <div style="position:absolute;left:24px;bottom:22px;padding:10px 16px;border-radius:10px;background:rgba(17,19,21,.88);border:1px solid var(--line);font:600 22px var(--sans)">Ask Piper · <span class="blue">Claude Sonnet 5.5</span></div>
    </div>
    <div class="note" style="position:absolute;right:76px;bottom:28px">Simulated · real numbers</div>
  </section>

  <!-- Close: the five steps again -->
  <section class="scene" id="s8">
    <svg id="s8p" width="1600" height="180" viewBox="0 0 1600 180" style="position:absolute;left:160px;top:440px;overflow:visible"></svg>
  </section>
</div>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, x) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * x)).join(",")})`;
const pop = (el, p, dy = 20) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };

/* color scales */
const NAVY = hex("#1E2E4C"), BLUE = hex("#6FA0FF"), ICE = hex("#DCE8FF"), RED1 = hex("#8E2F28"), RED = hex("#FF5A4E"), ROSE = hex("#FFC2BA");
const AMB0 = hex("#4A3214"), AMB = hex("#FFA23A"), AMB2 = hex("#FFE0B0"), VIO0 = hex("#2A2140"), VIO = hex("#B794F6"), VIO2 = hex("#F1E8FF");
const logRamp = (v, lo, a, b, c) => { if (!(v >= lo)) return null; const u = clamp(Math.log10(v / lo) / 2); return u < 0.5 ? mix(a, b, u / 0.5) : mix(b, c, (u - 0.5) / 0.5); };
const blueFor = (v, lo = 0.1) => logRamp(v, lo, NAVY, BLUE, ICE);
const amberFor = (v, lo = 0.05) => logRamp(v, lo, AMB0, AMB, AMB2);
const violetFor = (v, lo = 0.5) => logRamp(v, lo, VIO0, VIO, VIO2);
function redFor(n, hi = 4) { return n <= 0 ? null : n >= hi ? mix(RED, ROSE, clamp((n - hi) / (hi * 1.5))) : mix(RED1, RED, (n - 1) / Math.max(1, hi - 1)); }

/* the Boston grid */
const G = D.grid;
const C0 = Math.min(...G.map(g => g[0])), R1 = Math.max(...G.map(g => g[1]));
const NC = Math.max(...G.map(g => g[0])) - C0 + 1, NR = R1 - Math.min(...G.map(g => g[1])) + 1;
const key = (c, r) => c * 100000 + r;
const FC = new Map(D.fc.map(([c, r, v]) => [key(c, r), v]));
const SEV = new Map(D.sev.map(([c, r, o, e, ret, sm, rid]) => [key(c, r), { o, e, ret, sm, rid }]));
const order = [...D.fc].sort((a, b) => a[2] - b[2]);
function gridGeom(w, h, pad = 8) { const s = Math.min((w - 2 * pad) / NC, (h - 2 * pad) / NR); const ox = (w - s * NC) / 2, oy = (h - s * NR) / 2;
  return { s, xy: (c, r) => [ox + (c - C0) * s, oy + (R1 - r) * s] }; }
function drawGrid(ctx, w, h, fill) { const { s, xy } = gridGeom(w, h); ctx.clearRect(0, 0, w, h);
  for (const [c, r] of G) { const [x, y] = xy(c, r); ctx.fillStyle = fill(c, r) || "#1B1F23"; ctx.fillRect(x + 0.3, y + 0.3, s - 0.6, s - 0.6); } return { s, xy }; }

/* the five steps (journey strip + intro/close path) */
const STEPS = ["Data", "Evidence", "Severity", "Action", "Prevention"];
$("journey").innerHTML = STEPS.map((s, i) => `${i ? "<i></i>" : ""}<span class="s" data-i="${i}">${i + 1} · ${s}</span>`).join("");
function pathSvg(svg, p, nodesOn) {   // p: 0..1 how far the line has drawn; nodesOn(i) → 0..1
  const X = i => 100 + i * 350;
  let g = `<line x1="100" y1="50" x2="1500" y2="50" stroke="#2F353B" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="50" x2="${100 + 1400 * p}" y2="50" stroke="#6FA0FF" stroke-width="4" stroke-linecap="round"/>`;
  STEPS.forEach((s, i) => { const on = nodesOn(i), lit = on > 0.5;
    g += `<g opacity="${0.3 + 0.7 * on}"><circle cx="${X(i)}" cy="50" r="18" fill="${lit ? "#6FA0FF" : "#111315"}" stroke="${lit ? "#6FA0FF" : "#F2F3F1"}" stroke-width="4"/>
      <text x="${X(i)}" y="58" text-anchor="middle" fill="${lit ? "#111315" : "#F2F3F1"}" font-size="20" font-weight="700" font-family="Atkinson Hyperlegible Next">${i + 1}</text>
      <text x="${X(i)}" y="124" text-anchor="middle" fill="#F2F3F1" font-size="38" font-weight="600" font-family="Atkinson Hyperlegible Next">${s}</text></g>`; });
  svg.innerHTML = g;
}

/* scenes */
const S = []; let at = 0;
function scene(id, dur, step, draw) { S.push({ el: $(id), a: at, b: at + dur, step, draw }); at += dur; }

/* Intro */
scene("s0", 5.0, null, lt => {
  pop($("s0t"), out(seg(lt, 0.1, 0.8)), 24);
  const p = ease(seg(lt, 0.9, 3.9));
  pathSvg($("s0p"), p, i => seg(lt, 0.9 + i * 0.75, 1.2 + i * 0.75));
});

/* 1 Data */
const KEPT = ["Past rodent reports", "Dead animals", "Indoor pests", "Trash storage", "Move-in trash", "Litter", "Temperature", "Season"];
const DROP = ["Rain", "Snow", "Restaurants", "Red Sox games", "Demolitions", "Big Belly bins", "Permits", "Demographics", "Food inspections", "City lots"];
const CHIPS = [...KEPT.map(t => ({ t, k: 1 })), ...DROP.map(t => ({ t, k: 0 }))].sort((a, b) => ((a.t.length * 7919) % 13) - ((b.t.length * 7919) % 13));
CHIPS.forEach(c => { const el = document.createElement("div"); el.className = "chip";
  el.innerHTML = `<span class="ic">${D.icons[c.t] || ""}</span><span class="tx">${c.t}</span>${c.k ? `<span class="ck" style="opacity:0">✓</span>` : ""}`;
  $("s1chips").appendChild(el); c.el = el; c.ic = el.querySelector(".ic"); c.ck = el.querySelector(".ck"); c.tx = el.querySelector(".tx"); });
function layoutChips() {
  const rows = [[]]; let x = 0;
  CHIPS.forEach(c => { const w = c.el.offsetWidth; if (x + w > 1560 && rows.at(-1).length) { rows.push([]); x = 0; } rows.at(-1).push([c, x]); x += w + 20; });
  const top = 560 - (rows.length * 92) / 2;
  rows.forEach((row, i) => { const last = row.at(-1), rw = last[1] + last[0].el.offsetWidth, x0 = (1920 - rw) / 2;
    row.forEach(([c, cx]) => { c.el.style.left = x0 + cx + "px"; c.el.style.top = top + i * 92 + "px"; }); }); }
scene("s1", 5.0, 0, lt => {
  CHIPS.forEach((c, i) => {
    const p = out(seg(lt, 0.2 + i * 0.04, 0.7 + i * 0.04)); pop(c.el, p, 16);
    const v = seg(lt, 1.7 + i * 0.05, 2.1 + i * 0.05) > 0.5;
    if (c.k) { c.el.style.borderColor = v ? "#6FA0FF" : "#2F353B"; c.el.style.background = v ? "rgba(111,160,255,.16)" : "#1F2327"; c.ck.style.opacity = v ? 1 : 0; c.ic.style.color = v ? "#6FA0FF" : "#AEB5BC"; }
    else { c.el.style.opacity = p * (v ? 0.55 : 1); c.tx.style.textDecoration = v ? "line-through" : "none"; c.el.style.color = v ? "#8A929A" : "#F2F3F1"; c.ic.style.color = v ? "#68717A" : "#AEB5BC"; }
  });
});

/* 2 Evidence in the city: 12-week reports as 3D columns on the app's Boston basemap */
const NIGHT = { background: "#15181B", water: "#0E2236", building: "#1C2024", roadMinor: "#252A2F", roadMajor: "#363C43", rail: "#2A2F35", boundary: "#3A4148", labelPlace: "#AEB5BC", labelHalo: "#15181B" };
let map3d = null, map3dReady = false, mapVisible = false;
function initMap3d() {
  map3d = new maplibregl.Map({ container: "s2map", style: "https://tiles.openfreemap.org/styles/dark", center: [-71.075, 42.318], zoom: 11.2,
    pitch: 0, bearing: 0, interactive: false, attributionControl: false, fadeDuration: 0, preserveDrawingBuffer: true, maxPitch: 70 });
  map3d.on("load", () => {
    const set = (id, prop, v) => { try { map3d.setPaintProperty(id, prop, v); } catch (_) {} };
    for (const l of map3d.getStyle().layers) {
      const id = l.id.toLowerCase();
      if (l.type === "background") set(l.id, "background-color", NIGHT.background);
      else if (l.type === "fill") set(l.id, "fill-color", /water|ocean|lake|river/.test(id) ? NIGHT.water : /building/.test(id) ? NIGHT.building : /park|wood|grass|landcover|landuse|forest|cemetery|golf/.test(id) ? "#14211A" : NIGHT.background);
      else if (l.type === "line") set(l.id, "line-color", /water|river|stream/.test(id) ? NIGHT.water : /boundary|admin/.test(id) ? NIGHT.boundary : /rail|transit/.test(id) ? NIGHT.rail : /motorway|trunk|primary|major/.test(id) ? NIGHT.roadMajor : NIGHT.roadMinor);
      else if (l.type === "symbol") { if (/place|city|town|suburb|neighbourhood/.test(id)) { set(l.id, "text-color", NIGHT.labelPlace); set(l.id, "text-halo-color", NIGHT.labelHalo); set(l.id, "text-opacity", 0.45); }
        else { try { map3d.setLayoutProperty(l.id, "visibility", "none"); } catch (_) {} } }
    }
    map3d.addSource("now", { type: "geojson", data: D.now3d });
    map3d.addLayer({ id: "now3d", type: "fill-extrusion", source: "now", paint: {
      "fill-extrusion-color": ["interpolate", ["linear"], ["get", "a"], 1, "#8E2F28", 3, "#D9483C", 6, "#FF5A4E", 12, "#FF8F84", 24, "#FFC2BA"],
      "fill-extrusion-height": 0, "fill-extrusion-base": 0, "fill-extrusion-opacity": 0.95, "fill-extrusion-vertical-gradient": true } });
    map3d.setLight({ anchor: "map", color: "#ffffff", intensity: 0.55, position: [1.4, 200, 35] });
    map3dReady = true;
  });
}
window.settle = () => new Promise(res => {   // capture awaits this: resolves once the 3D map drew the frame
  if (!mapVisible || !map3d) return res();
  const go = () => { let done = false; const fin = () => { if (!done) { done = true; res(); } }; map3d.once("idle", fin); map3d.triggerRepaint(); setTimeout(fin, 10000); };
  map3dReady ? go() : map3d.once("load", () => setTimeout(go, 0));
});
scene("s2", 7.0, 1, lt => {
  mapVisible = true;
  if (map3dReady) {
    const tilt = ease(seg(lt, 0.4, 3.0)), grow = ease(seg(lt, 0.9, 3.2));
    map3d.jumpTo({ center: [lerp(-71.075, -71.088, tilt), lerp(42.318, 42.322, tilt)], zoom: lerp(11.2, 11.95, tilt), pitch: 60 * tilt, bearing: -8 - 26 * ease(seg(lt, 0.4, 7.0)) });
    map3d.setPaintProperty("now3d", "fill-extrusion-height", ["*", ["sqrt", ["get", "a"]], 170 * grow]);
  }
  $("s2leg").style.opacity = seg(lt, 1.6, 2.2);
});

/* 3 Severity: what happened + what's coming + what keeps returning */
const RG = D.regions;
const topCells = new Map(); RG.forEach(r => r.cells.forEach(c => topCells.set(c, r.rank)));
const PARTS = [["s3a", "Reports · last 12 weeks", "#FF5A4E", d => redFor(d.o, 6)], ["s3b", "Expected · next 4 weeks", "#6FA0FF", d => blueFor(d.e)], ["s3c", "Expected returns · 60 days", "#FFA23A", d => amberFor(d.ret)]];
$("s3row").innerHTML = PARTS.map(([, l, c], i) => `<div class="s3l" style="position:absolute;left:${i * 600}px;top:0;font-size:24px;color:var(--fg2)"><i style="display:inline-block;width:16px;height:16px;border-radius:3px;background:${c};margin-right:10px;vertical-align:-1px"></i>${l}</div>`).join("")
  + `<div class="s3op" style="position:absolute;left:520px;top:150px;font:500 64px var(--mono);color:var(--fg3)">+</div><div class="s3op" style="position:absolute;left:1120px;top:150px;font:500 64px var(--mono);color:var(--fg3)">+</div>`;
$("s3list").innerHTML = `<div class="lbl" style="margin-bottom:16px">Most severe areas</div>` + RG.slice(0, 3).map(r =>
  `<div class="s3r" style="display:flex;align-items:baseline;gap:22px;padding:14px 0;border-bottom:1px solid var(--line)">
    <span class="num violet" style="font-size:44px;width:40px">${r.rank}</span><span style="font-size:36px;font-weight:600;flex:1">${r.n}</span>
    <span class="num" style="font-size:24px;color:var(--fg2)">${r.sev.observed_12w} + ${r.sev.expected_4w} + ${r.sev.expected_returns_60d}</span></div>`).join("")
  + `<div class="note" style="margin-top:14px">Weighted by residents</div>`;
scene("s3", 8.5, 2, lt => {
  PARTS.forEach(([id, , , f], i) => { const ctx = $(id).getContext("2d"), p = out(seg(lt, 0.3 + i * 0.5, 1.0 + i * 0.5));
    $(id).style.opacity = p; drawGrid(ctx, 480, 270, (c, r) => { const d = SEV.get(key(c, r)); return d && f(d); }); });
  document.querySelectorAll(".s3l").forEach((el, i) => el.style.opacity = out(seg(lt, 0.3 + i * 0.5, 1.0 + i * 0.5)));
  document.querySelectorAll(".s3op").forEach((el, i) => el.style.opacity = seg(lt, 0.9 + i * 0.5, 1.3 + i * 0.5));
  const bp = out(seg(lt, 2.4, 3.2)), ctx = $("s3big").getContext("2d");
  $("s3big").style.opacity = bp;
  $("s3eq").style.opacity = bp;
  const g = drawGrid(ctx, 900, 400, (c, r) => { const d = SEV.get(key(c, r)); return d && violetFor(d.sm); });
  const ol = seg(lt, 3.6, 4.2);
  if (ol > 0) { ctx.strokeStyle = `rgba(242,243,241,${ol})`; ctx.lineWidth = 1.6;
    for (const [cid] of topCells) { const [, c, r] = cid.split("_"); const [x, y] = g.xy(+c, +r); ctx.strokeRect(x + 0.5, y + 0.5, g.s - 1, g.s - 1); } }
  document.querySelectorAll(".s3r").forEach((el, i) => pop(el, out(seg(lt, 4.2 + i * 0.4, 4.8 + i * 0.4)), 0));
  $("s3list").firstElementChild.style.opacity = seg(lt, 4.0, 4.5); $("s3list").lastElementChild.style.opacity = seg(lt, 5.4, 6.0);
});

/* 4 Action: evidence nearby + past cases → Claude Haiku → what to do */
const R0 = RG[0];
$("s4h").textContent = `What to do in ${R0.n}`;
const EV = [
  ["Trash out early nearby", `<b>7.2×</b> the Boston level`],
  ["Illegal dumping nearby", `<b>3.5×</b> the Boston level`],
  ["Charles St", `<b>66</b> reports in 2 years, <b>12</b> returns`],
  ["Past Boston cases", `<b>${D.pastCases.toLocaleString()}</b> closures: what worked`],
];
$("s4ev").innerHTML = EV.map(([t, s], i) => `<div class="ev" style="top:${280 + i * 150}px">${t}<small>${s}</small></div>`).join("");
const GUARDS = ["Allowed actions only", "No poison", "Every number from the data"];
$("s4sol").innerHTML = `<div class="lbl">Recommendation · <span class="blue">Claude Haiku</span></div>
  <div style="font-size:34px;font-weight:600;line-height:1.3;margin-top:18px">${R0.action}</div>
  <div style="display:grid;gap:12px;margin-top:28px;font-size:26px">${GUARDS.map(x => `<div class="g"><span class="check">✓</span>${x}</div>`).join("")}</div>`;
scene("s4", 9.0, 3, lt => {
  document.querySelectorAll("#s4ev .ev").forEach((el, i) => { const p = out(seg(lt, 0.3 + i * 0.45, 0.9 + i * 0.45)); el.style.opacity = p; el.style.transform = `translateX(${(1 - p) * -30}px)`; });
  const fp = ease(seg(lt, 2.4, 3.6));
  let g = "";
  EV.forEach((_, i) => { const y = 280 + i * 150 + 52, x0 = 744, x1 = 1060, y1 = 520;
    const d = `M${x0},${y} C${x0 + 160},${y} ${x1 - 160},${y1} ${x1},${y1}`;
    g += `<path d="${d}" fill="none" stroke="#6FA0FF" stroke-width="3" stroke-dasharray="420" stroke-dashoffset="${420 * (1 - fp)}" opacity=".8"/>`;
    if (fp > 0.05) { const u = (lt * 0.5 + i * 0.25) % 1, bx = (1 - u) ** 3 * x0 + 3 * (1 - u) ** 2 * u * (x0 + 160) + 3 * (1 - u) * u * u * (x1 - 160) + u ** 3 * x1, by = (1 - u) ** 3 * y + 3 * (1 - u) ** 2 * u * y + 3 * (1 - u) * u * u * y1 + u ** 3 * y1;
      if (u < fp) g += `<circle cx="${bx}" cy="${by}" r="6" fill="#DCE8FF"/>`; } });
  $("s4arrows").innerHTML = g;
  const sp = out(seg(lt, 3.4, 4.1)); $("s4sol").style.opacity = sp; $("s4sol").style.transform = `translateX(${(1 - sp) * 30}px)`;
  document.querySelectorAll("#s4sol .g").forEach((el, i) => el.style.opacity = seg(lt, 4.6 + i * 0.35, 5.0 + i * 0.35));
});

/* 5 Prevention: forecast + early warning */
const EMG = new Set(D.emerging.map(([c, r]) => key(c, r)));
$("s5call").innerHTML = `<div class="s5i"><div class="blue" style="font:700 110px/1 var(--sans)">4 weeks</div><div style="font-size:30px;color:var(--fg2);margin-top:10px">expected reports for every block</div></div>
  <div class="s5i" style="margin-top:56px"><div style="font:700 110px/1 var(--sans)">${D.emerging.length}</div><div style="font-size:30px;color:var(--fg2);margin-top:10px">emerging hotspots, flagged before<br>the reports pile up</div></div>`;
scene("s5", 7.5, 4, lt => {
  const ctx = $("s5c").getContext("2d"), W = 1000, H = 880;
  const appear = seg(lt, 0.2, 1.2), fill = seg(lt, 1.0, 3.0), nFill = Math.floor(ease(fill) * order.length), lit = new Set();
  for (let i = order.length - nFill; i < order.length; i++) lit.add(key(order[i][0], order[i][1]));
  const geo = gridGeom(W, H); ctx.clearRect(0, 0, W, H);
  for (const [c, r] of G) { if ((R1 - r) > appear * (NR + 10)) continue; const [x, y] = geo.xy(c, r);
    ctx.fillStyle = (lit.has(key(c, r)) && blueFor(FC.get(key(c, r)))) || "#1B1F23"; ctx.fillRect(x + 0.4, y + 0.4, geo.s - 0.8, geo.s - 0.8); }
  const em = seg(lt, 3.6, 4.3);
  if (em > 0) { ctx.strokeStyle = `rgba(242,243,241,${em})`; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    for (const k of EMG) { const [x, y] = geo.xy(Math.floor(k / 100000), k % 100000); ctx.strokeRect(x + 1, y + 1, geo.s - 2, geo.s - 2); } ctx.setLineDash([]); }
  document.querySelectorAll(".s5i").forEach((el, i) => pop(el, out(seg(lt, i ? 3.6 : 1.4, i ? 4.3 : 2.1))));
});

/* 5 Prevention: proof on weeks it never saw */
const BT = new Map(D.bt.map(([c, r, y, g]) => [key(c, r), { y, g }]));
const WK = D.btWeeks, NW = WK.length, WEEKLY = D.weekly, LASTW = WEEKLY.slice(-NW), TOPN = Math.round(G.length * 0.1);
const topSets = WK.map((_, wi) => new Set([...BT.entries()].sort((a, b) => b[1].g[wi] - a[1].g[wi]).slice(0, TOPN).map(e => e[0])));
const sumY = WEEKLY.reduce((a, w) => a + w[1], 0);
const capM = WEEKLY.reduce((a, w) => a + w[4] * w[1], 0) / sumY, capB = WEEKLY.reduce((a, w) => a + w[5] * w[1], 0) / sumY, better = WEEKLY.filter(w => w[4] > w[5]).length;
$("s6call").innerHTML = `<span><b class="num blue" style="font-size:44px">${Math.round(capM * 100)}%</b> of reports in the model's top 10% of blocks</span>
  <span><b class="num" style="font-size:36px;color:var(--fg)">${Math.round(capB * 100)}%</b> without the model</span>
  <span><b class="num" style="font-size:36px;color:var(--fg)">${better}/${WEEKLY.length}</b> weeks better since 2024</span>`;
scene("s6", 7.5, 4, lt => {
  const wi = clamp(Math.floor((lt - 0.8) / 0.38), 0, NW - 1), top = topSets[wi], outline = seg(lt, 1.2, 1.8);
  const pos = clamp((lt - 0.8) / 0.38, 0, NW - 1), TW = 1680, x0 = 40, x1 = TW - 40, X = i => x0 + (x1 - x0) * i / (NW - 1);
  let tl = `<line x1="${x0}" y1="62" x2="${x1}" y2="62" stroke="#2F353B" stroke-width="2"/>`;
  WK.forEach((w, i) => { const h = 44 * LASTW[i][4], past = i <= wi;
    tl += `<rect x="${X(i) - 14}" y="${62 - h}" width="28" height="${h}" rx="3" fill="${past ? "#6FA0FF" : "#2A2F34"}" opacity="${i === wi ? 1 : past ? 0.55 : 1}"/>`;
    const d = new Date(w + "T12:00:00"); if (i === 0 || d.getDate() <= 7) tl += `<text x="${X(i)}" y="92" text-anchor="middle" fill="#8A929A" font-size="20" font-family="Atkinson Hyperlegible Mono">${d.toLocaleDateString("en-US", { month: "short" })}</text>`; });
  const px = X(pos);
  tl += `<line x1="${px}" y1="4" x2="${px}" y2="70" stroke="#F2F3F1" stroke-width="2"/><circle cx="${px}" cy="62" r="8" fill="#F2F3F1"/>
    <text x="${clamp(px, 120, TW - 120)}" y="-4" text-anchor="middle" fill="#F2F3F1" font-size="26" font-family="Atkinson Hyperlegible Next" font-weight="600">${Math.round(LASTW[wi][4] * 100)}% in top 10%</text>`;
  $("s6tl").innerHTML = tl; $("s6tl").style.opacity = seg(lt, 0.3, 0.9);
  const get = (c, r) => BT.get(key(c, r)), W = 544, H = 540;
  const a = $("s6a").getContext("2d"), b = $("s6b").getContext("2d"), cc = $("s6c").getContext("2d");
  const ga = drawGrid(a, W, H, (c, r) => { const d = get(c, r); return d && redFor(d.y[wi]); });
  if (outline > 0) { a.strokeStyle = `rgba(242,243,241,${0.4 * outline})`; a.lineWidth = 1;
    for (const k of top) { const [x, y] = ga.xy(Math.floor(k / 100000), k % 100000); a.strokeRect(x + 0.7, y + 0.7, ga.s - 1.4, ga.s - 1.4); } }
  drawGrid(b, W, H, (c, r) => { const d = get(c, r); return d && blueFor(d.g[wi], 0.05); });
  const gc = drawGrid(cc, W, H, (c, r) => { const d = get(c, r); return d && blueFor(d.g[wi], 0.05); });
  cc.fillStyle = "#FF5A4E";
  for (const [k, d] of BT) { const n = d.y[wi]; if (!n) continue; const [x, y] = gc.xy(Math.floor(k / 100000), k % 100000);
    cc.beginPath(); cc.arc(x + gc.s / 2, y + gc.s / 2, Math.max(1.6, gc.s * Math.min(0.62, 0.22 * Math.sqrt(n))), 0, 7); cc.fill(); }
  [...$("s6call").children].forEach((el, i) => el.style.opacity = seg(lt, 4.2 + i * 0.4, 4.7 + i * 0.4));
});

/* In the platform (simulation) */
const TOP = D.top[0], top4 = D.top.slice(0, 4);
const Q = "Where should we look next?";
const ANS = `Most expected reports in the next 4 weeks: ${top4[0].n.split(" /")[0]} (${top4[0].t.toFixed(1)}), ${top4[1].n} (${top4[1].t.toFixed(1)}), ${top4[2].n} (${top4[2].t.toFixed(1)}), ${top4[3].n} (${top4[3].t.toFixed(1)}).`;
const TOOLS = ["get_insights", "map_show_forecast", "map_highlight"];
const mapCtx = $("s7map").getContext("2d"), MAPW = 1240, MAPH = 896;
function drawApp(lt) {
  mapCtx.fillStyle = "#0D1A26"; mapCtx.fillRect(0, 0, 1800, 960);
  const surf = seg(lt, 1.0, 1.8), fly = ease(seg(lt, 4.4, 5.4));
  const geo = gridGeom(MAPW, MAPH); const [tx, ty] = geo.xy(TOP.c, TOP.r);
  mapCtx.save(); mapCtx.translate(0, 64);
  const zoom = lerp(1, 1.9, fly); mapCtx.translate(MAPW / 2, MAPH / 2); mapCtx.scale(zoom, zoom); mapCtx.translate(-lerp(MAPW / 2, tx, fly), -lerp(MAPH / 2, ty, fly));
  for (const [c, r] of G) { const [x, y] = geo.xy(c, r); mapCtx.fillStyle = "#1A1D20"; mapCtx.fillRect(x, y, geo.s + 0.6, geo.s + 0.6); }
  if (surf > 0) for (const [c, r, v] of D.fc) { if (v < 1) continue; const [x, y] = geo.xy(c, r); mapCtx.fillStyle = blueFor(v, 0.5); mapCtx.globalAlpha = surf * 0.85;
    mapCtx.fillRect(x - geo.s * 0.15, y - geo.s * 0.15, geo.s * 1.3, geo.s * 1.3); }
  mapCtx.globalAlpha = 1;
  const hl = seg(lt, 5.0, 5.6);
  if (hl > 0) top4.forEach(b => { const [x, y] = geo.xy(b.c, b.r); mapCtx.strokeStyle = `rgba(242,243,241,${hl})`; mapCtx.lineWidth = 3 / zoom; mapCtx.beginPath(); mapCtx.arc(x + geo.s / 2, y + geo.s / 2, geo.s * 2.2, 0, 7); mapCtx.stroke(); });
  mapCtx.restore();
}
const typed = (s, p) => s.slice(0, Math.floor(s.length * clamp(p)));
const tabs = a => `<div style="display:flex;gap:28px;padding:18px 26px 0;border-bottom:1px solid #2F353B;font-size:21px">${["Inspect", "Insights", "Ask"].map(x => `<span style="padding-bottom:14px;${x === a ? "color:#F2F3F1;border-bottom:2px solid #F2F3F1" : "color:#8A929A"}">${x}</span>`).join("")}</div>`;
scene("s7", 7.6, null, lt => {
  drawApp(lt);
  const on = lt > 0.9;
  $("fcCtl").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;font-weight:600">Forecast
    <span style="width:46px;height:26px;border-radius:13px;background:${on ? "#6FA0FF" : "#2F353B"};position:relative;display:inline-block"><span style="position:absolute;top:3px;left:${on ? 23 : 3}px;width:20px;height:20px;border-radius:10px;background:#F2F3F1"></span></span></div>
    ${on ? `<div style="height:10px;border-radius:5px;margin-top:14px;background:linear-gradient(90deg,#1E2E4C,#6FA0FF,#DCE8FF)"></div>` : ""}`;
  const P = [[700, 560], [370, 108], [1500, 900]], m1 = ease(seg(lt, 0.2, 0.85)), m2 = ease(seg(lt, 1.6, 2.3));
  $("cursor").style.transform = `translate(${lerp(lerp(P[0][0], P[1][0], m1), P[2][0], m2)}px, ${lerp(lerp(P[0][1], P[1][1], m1), P[2][1], m2)}px)`;
  const q = typed(Q, seg(lt, 2.4, 3.2)), tools = TOOLS.filter((_, i) => lt > 3.5 + i * 0.3), ans = typed(ANS, seg(lt, 5.0, 6.6));
  $("rp").innerHTML = tabs("Ask") + `<div style="padding:24px 26px;display:grid;gap:18px;font-size:23px;line-height:1.45">
    ${q.length === Q.length ? `<div style="justify-self:end;max-width:420px;background:#F2F3F1;color:#111315;padding:12px 16px;border-radius:14px">${Q}</div>` : ""}
    ${tools.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${tools.map(x => `<span class="num" style="font-size:16px;padding:5px 10px;border-radius:8px;border:1px solid #2F353B;color:#6FA0FF">${x} ✓</span>`).join("")}</div>` : ""}
    ${ans ? `<div>${ans}</div>` : ""}
    ${ans.length === ANS.length ? `<div style="font-size:17px;color:#8A929A">Sources ▸</div>` : ""}</div>
    <div style="position:absolute;left:26px;right:26px;bottom:24px;border:1px solid #2F353B;border-radius:12px;padding:14px 16px;font-size:20px;color:${q && q.length < Q.length ? "#F2F3F1" : "#68717A"}">${q && q.length < Q.length ? q + "▍" : "Ask Piper"}</div>`;
});

/* Close: the five steps, all lit */
scene("s8", 4.0, null, lt => { pathSvg($("s8p"), ease(seg(lt, 0.2, 1.6)), i => seg(lt, 0.2 + i * 0.28, 0.5 + i * 0.28)); });
const DUR = at;

/* timeline: dip transitions (outgoing fades out, then incoming fades in); 5-step strip top-right */
function render(t) {
  let step = null; mapVisible = false;
  for (const s of S) {
    const fadeIn = s.a === 0 ? 1 : seg(t, s.a, s.a + 0.35);
    const vis = s === S[S.length - 1] ? fadeIn : Math.min(fadeIn, 1 - seg(t, s.b - 0.3, s.b));
    s.el.style.opacity = vis;
    if (vis > 0) s.draw(t - s.a);
    if (s.step !== null && t >= s.a && t < s.b) step = s.step;
  }
  const j = $("journey"); j.style.opacity = step === null ? 0 : 1;
  if (step !== null) j.querySelectorAll(".s").forEach(el => { const k = +el.dataset.i; el.className = "s" + (k === step ? " on" : k < step ? " done" : ""); });
}
window.render = render; window.DUR = DUR;
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $("stage").style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`; }
addEventListener("resize", fit); fit();
const qs = new URLSearchParams(location.search);
document.fonts.ready.then(() => {
  layoutChips(); initMap3d();
  if (qs.has("t")) render(+qs.get("t"));
  else if (!qs.has("capture")) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
  window.ready = true;
});
</script>
</body>
</html>
