[project]
name = "rat-audit-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "shapely>=2.0",
  "pyproj>=3.6",
  "modal>=1.6",
  "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.uv]
package = false
